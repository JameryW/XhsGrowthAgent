<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <!-- Keep public first paint independent of third-party font availability;
         main.css provides an Inter/system fallback stack. -->
    <meta name="description" content="AI驱动的自动化小红书内容创作平台">
    <meta name="theme-color" content="#f43f5e">
    <title>小红书增长引擎</title>
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem('xhs-theme-mode')
          const dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0b1120' : '#f43f5e')
        } catch (_) {
          // Ignore storage and media-query restrictions; Vue applies the default theme.
        }
      })()
    </script>
    <!-- Optional analytics load after the first paint; third-party availability must not gate DCL/LCP. -->
    <script>
      (() => {
        const scripts = [
          {
            src: 'https://stats.jameryw.dev/recorder.js',
            attrs: { 'data-sample-rate': '0.15', 'data-mask-level': 'moderate', 'data-max-duration': '300000' },
          },
          { src: 'https://stats.jameryw.dev/script.js', attrs: {} },
        ]
        const loadAnalytics = () => scripts.forEach(({ src, attrs }) => {
          const script = document.createElement('script')
          script.src = src
          script.async = true
          script.dataset.websiteId = 'b1c83d57-4dbd-4854-9206-227e7a3f8f1d'
          Object.entries(attrs).forEach(([key, value]) => script.setAttribute(key, value))
          document.head.appendChild(script)
        })
        const schedule = window.requestIdleCallback
          ? (callback) => window.requestIdleCallback(callback, { timeout: 2000 })
          : (callback) => window.setTimeout(callback, 0)
        // Keep optional third-party analytics out of the first navigation
        // budget; product funnel telemetry is same-origin and starts in Vue.
        window.addEventListener('load', () => {
          window.setTimeout(() => schedule(loadAnalytics), 3000)
        }, { once: true })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
