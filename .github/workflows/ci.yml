name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy
        # The 556-error strict baseline was cleared (see chore/mypy-cleanup).
        # Run `mypy backend` unconditionally — any new error fails CI.
        run: mypy backend

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    # Disposable server for the Creator Agent cross-backend parity suite, which
    # otherwise skips and leaves every Postgres branch of the adapter unexecuted.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the first test can connect before the server accepts,
        # which would surface as an intermittent teardown failure.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Deliberately not POSTGRES_URI: tests/conftest.py pops that so the suite
      # stays hermetic. The parity module opens its own pool from this variable,
      # creates a randomly named scratch database, and drops it on teardown.
      XHS_PG_PARITY_URI: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      # A suite that silently skips is indistinguishable from one that passes, and
      # that is precisely how every Postgres branch of the adapter went untested.
      # Re-running the parity module alone costs seconds and makes the wiring,
      # rather than the result, the thing that fails here.
      - name: Verify backend parity actually ran
        run: |
          out=$(pytest tests/integration/test_creator_agent_backend_parity.py -q)
          echo "$out" | tail -3
          if ! echo "$out" | grep -q " passed"; then
            echo "::error::Postgres backend parity did not execute; check the postgres service and XHS_PG_PARITY_URI" >&2
            exit 1
          fi

  context-baseline:
    name: Context Compiler Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Token cost + layer stability + drift gate
        # Offline and deterministic: no workflow, no store, no model call.
        # Exits 1 if any stability invariant (repeat / shuffle / dedup /
        # budget trim order) breaks, or if compiled token cost drifts beyond
        # the threshold vs the committed snapshot — a prompt or compiler
        # change that inflates context must be a deliberate, visible act
        # (refresh with --write-snapshot in the same PR).
        run: python scripts/benchmarks/context_compiler_baseline.py --compare --drift-pct 5

  tool-runtime-gate:
    name: Tool Runtime Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Agent imports + declaration agreement + coverage
        # Static and offline: no agent module is imported, no workflow runs.
        # Exits 1 if an agent holds a tool object the Gateway never saw, or if
        # a capability it invokes is undeclared, unreadable, or absent from
        # the catalogue. A source that cannot be parsed fails too — a gate
        # that skips what it does not understand reports a false pass.
        run: python scripts/gates/tool_runtime_gate.py

  omp-typecheck:
    name: OMP Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/omp/extensions/xhsagent-ext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/omp/extensions/xhsagent-ext/package.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck

  frontend:
    name: Frontend (type-check · test · i18n · axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install
      # INF-09: frontend quality gate — type-check + unit/axe tests + i18n key
      # consistency. Build is intentionally NOT here (vite OOM on CI runners is
      # a known issue; type-check is the static gate).
      - name: Type-check
        run: npm run type-check
      - name: Test (vitest + axe)
        run: npm run test:run
      - name: i18n check
        run: npm run i18n:check
