[project]
name = "xhs-growth-engine"
version = "0.1.0"
description = "小红书增长引擎 Agent — 全链路自动化内容增长系统"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=2.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "pdfplumber>=0.11",
    "uvicorn>=0.34",
    "websockets>=14.0",
    "httpx>=0.28",
    "tenacity>=9.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "redis>=5.2",
    "pyyaml>=6.0",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "fake-useragent>=1.4",  # 随机 UA 生成
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "datamodel-code-generator>=0.25.0",
]

[project.scripts]
xhs-growth = "backend.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/api/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true